name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BookingApi.Tests

      - name: Build
        run: dotnet build BookingApi.Tests --no-restore

      - name: Test
        run: dotnet test BookingApi.Tests --no-build --verbosity normal