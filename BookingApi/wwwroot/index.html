<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Slot</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --ink:#1f2430; --muted:#6b7280; --brand:#4f46e5; --ok:#16a34a; --bad:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:28px 16px; text-align:center; }
  header h1 { margin:0 0 6px; font-size:1.7rem; }
  header p { margin:0; opacity:.85; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  label { color:var(--muted); font-size:.95rem; }
  #toast { min-height:24px; margin-bottom:12px; font-weight:600; }
  .ok { color:var(--ok); } .err { color:var(--bad); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:12px; }
  .slot { background:var(--card); border-radius:12px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); display:flex; flex-direction:column; gap:8px; }
  .slot.booked { opacity:.55; }
  .time { font-weight:700; } .meta { color:var(--muted); font-size:.9rem; }
  .tag { font-size:.8rem; font-weight:700; }
  button { border:0; border-radius:8px; padding:9px 12px; font-weight:600; cursor:pointer; background:var(--brand); color:#fff; }
  button:disabled { background:#cbd5e1; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--bad); border:1px solid var(--bad); }
  input[type=text] { padding:9px; border:1px solid #d1d5db; border-radius:8px; width:100%; }
  h2 { margin:28px 0 10px; font-size:1.15rem; }
  .mine { background:var(--card); border-radius:12px; padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 1px 4px rgba(0,0,0,.08); }
</style>
</head>
<body>
<header>
  <h1>Book a Slot</h1>
  <p>Pick a time. If someone beats you to it, you will find out instantly.</p>
</header>

<main>
  <div class="bar">
    <label><input type="checkbox" id="onlyFree"> Show only available</label>
    <button id="refresh">Refresh</button>
  </div>
  <div id="toast"></div>
  <div class="grid" id="slots"></div>

  <h2>My bookings</h2>
  <div id="mine"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const KEY = "myBookings";
const getMine = () => JSON.parse(localStorage.getItem(KEY) || "[]");
const setMine = list => localStorage.setItem(KEY, JSON.stringify(list));

function toDate(s) {                       // treat server times as UTC
  return new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s + "Z");
}
const fmt = s => toDate(s).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });

function say(msg, ok) {
  $("toast").textContent = msg;
  $("toast").className = ok ? "ok" : "err";
}

async function errorText(res) {            // API errors may be plain strings or ProblemDetails
  const raw = await res.text();
  try {
    const j = JSON.parse(raw);
    if (typeof j === "string") return j;
    if (j.errors) return Object.values(j.errors).flat().join(" ");
    return j.title || raw;
  } catch { return raw || res.statusText; }
}

async function loadSlots() {
  const url = "/api/slots" + ($("onlyFree").checked ? "?onlyAvailable=true" : "");
  const res = await fetch(url);
  const slots = await res.json();
  $("slots").innerHTML = "";
  if (!slots.length) { $("slots").textContent = "No slots found."; return; }

  for (const s of slots) {
    const booked = typeof s.isBooked === "boolean" ? s.isBooked
                 : Object.values(s).find(v => typeof v === "boolean");
    const card = document.createElement("div");
    card.className = "slot" + (booked ? " booked" : "");
    card.innerHTML = `
      <div class="time">${fmt(s.startsAt)}</div>
      <div class="meta">${s.durationMinutes} minutes</div>
      <div class="tag ${booked ? "err" : "ok"}">${booked ? "Booked" : "Available"}</div>`;
    if (!booked) {
      const name = Object.assign(document.createElement("input"), { type: "text", placeholder: "Your name" });
      const btn = Object.assign(document.createElement("button"), { textContent: "Book" });
      btn.onclick = () => book(s, name.value, btn);
      card.append(name, btn);
    }
    $("slots").append(card);
  }
}

async function book(slot, name, btn) {
  name = name.trim();
  if (name.length < 2) return say("Please enter your name (at least 2 characters).", false);
  btn.disabled = true;
  const res = await fetch("/api/bookings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ slotId: slot.id, customerName: name })
  });
  if (res.status === 201) {
    const b = await res.json();
    setMine([...getMine(), { id: b.id, name: b.customerName, startsAt: slot.startsAt }]);
    say(`Booked for ${fmt(slot.startsAt)}. Your booking number is ${b.id}.`, true);
  } else {
    say(await errorText(res), false);      // 409 shows the "already booked" message
  }
  await refreshAll();
}

async function cancel(id) {
  const res = await fetch(`/api/bookings/${id}`, { method: "DELETE" });
  if (res.ok || res.status === 404) {
    setMine(getMine().filter(b => b.id !== id));
    say("Booking cancelled.", true);
  } else say(await errorText(res), false);
  await refreshAll();
}

function renderMine() {
  const list = getMine();
  $("mine").innerHTML = list.length ? "" : "<div class='meta'>Nothing booked from this browser yet.</div>";
  for (const b of list) {
    const row = document.createElement("div");
    row.className = "mine";
    row.innerHTML = `<div><strong>${fmt(b.startsAt)}</strong><div class="meta">#${b.id} · ${b.name.replace(/</g, "&lt;")}</div></div>`;
    const btn = Object.assign(document.createElement("button"), { textContent: "Cancel", className: "ghost" });
    btn.onclick = () => cancel(b.id);
    row.append(btn);
    $("mine").append(row);
  }
}

const refreshAll = async () => { await loadSlots(); renderMine(); };
$("refresh").onclick = refreshAll;
$("onlyFree").onchange = loadSlots;
refreshAll();
</script>
</body>
</html>
